[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sousa-stack/tuneox"
homepage = "https://tuneox.com"

[workspace.dependencies]
tuneox-core = { path = "crates/tuneox-core" }
tuneox-pioneer = { path = "crates/tuneox-pioneer" }
tuneox-library = { path = "crates/tuneox-library" }
tuneox-commands = { path = "crates/tuneox-commands" }
tuneox-mcp = { path = "crates/tuneox-mcp" }
tuneox-audio = { path = "crates/tuneox-audio" }

clap = { version = "4", features = ["derive"] }
cpal = "0.18"
dirs = "6"
rtrb = "0.4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["aac", "aiff", "alac", "all-meta", "flac", "isomp4", "mp3", "pcm", "wav"] }
tempfile = "3"
thiserror = "2"
triple_buffer = "9"
uuid = { version = "1", features = ["v7"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
