[package]
name = "tuneox-desktop"
description = "TuneOx desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "tuneox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json.workspace = true
tuneox-audio.workspace = true
tuneox-commands.workspace = true
tuneox-library.workspace = true
